name: Update diary and music indexes
on:
  push:
    branches: [main]
    paths:
      - 'diary/**'
      - 'assets/diary-core.mjs'
      - 'scripts/build-diary-index.mjs'
      - 'assets/music/**'
      - 'scripts/build-music-playlist.mjs'
      - '.github/workflows/diary-index.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: diary-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild diary indexes and music playlist
        run: |
          git pull --ff-only origin main
          node --test tests/diary-core.test.mjs tests/music-playlist.test.mjs
          node scripts/build-diary-index.mjs
          node scripts/build-music-playlist.mjs
          git add assets/diary-index.json assets/diary-search.json assets/music/playlist.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update diary and music indexes"
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger branch-based Pages builds.
      - name: Publish the refreshed index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
