name: Check diary behavior
on:
  push:
    branches: [main]
    paths:
      - 'assets/diary-*.mjs'
      - 'assets/scene-clock.mjs'
      - 'assets/music-player.js'
      - 'assets/music-upload.mjs'
      - 'scripts/build-music-playlist.mjs'
      - 'server/diary-auth/**'
      - 'tests/**'
      - '.github/workflows/diary-tests.yml'
  pull_request:
    paths:
      - 'assets/diary-*.mjs'
      - 'assets/scene-clock.mjs'
      - 'assets/music-player.js'
      - 'assets/music-upload.mjs'
      - 'scripts/build-music-playlist.mjs'
      - 'server/diary-auth/**'
      - 'tests/**'
      - '.github/workflows/diary-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
