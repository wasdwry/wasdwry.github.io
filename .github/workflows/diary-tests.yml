name: Check diary behavior
on:
  push:
    branches: [main]
    paths:
      - 'assets/diary-*.mjs'
      - 'tests/**'
      - '.github/workflows/diary-tests.yml'
  pull_request:
    paths:
      - 'assets/diary-*.mjs'
      - 'tests/**'
      - '.github/workflows/diary-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/diary-core.test.mjs tests/diary-publish.test.mjs
